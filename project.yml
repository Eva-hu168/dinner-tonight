name: DinnerTonight

options:
  bundleIdPrefix: com.dinnertonight
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  DinnerCore:
    path: Packages/DinnerCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  DinnerTonight:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DinnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinnertonight.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dinner Tonight
        INFOPLIST_KEY_NSCameraUsageDescription: Dinner Tonight uses the camera to spot the ingredients you photograph. Photos stay on this iPhone and are not saved.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
